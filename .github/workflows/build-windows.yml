name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller + Pillow
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Generate assets (logo + ícone derivado)
        run: python generate_assets.py

      - name: Build EXE (PyInstaller, arquivo único)
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DXIngestEventos --icon assets/icon.ico --add-data "assets/logo.png;assets" --add-data "assets/icon.png;assets" app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dx-ingest-eventos
          path: dist/DXIngestEventos.exe
