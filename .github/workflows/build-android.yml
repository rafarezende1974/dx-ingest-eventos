name: Android alpha - test and APK
on:
  push:
    branches: ['codex/android-alpha']
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test, lint and build APK
        run: gradle -p android --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 UI and permission tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: |
            adb shell wm size 1600x1000
            adb shell wm density 160
            gradle -p android --no-daemon connectedDebugAndroidTest
            adb shell am start -W -n br.com.editorassistente.android.alpha/br.com.editorassistente.MainActivity
            sleep 3
            adb exec-out screencap -p > android/app/build/reports/android-tablet.png
      - name: Package alpha
        run: |
          mkdir -p android-delivery
          cp android/app/build/outputs/apk/debug/app-debug.apk android-delivery/EditorAssistente-Android-0.1-alpha.apk
          cp android/README.md android-delivery/LEIA-ME.md
          cd android-delivery
          sha256sum EditorAssistente-Android-0.1-alpha.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: editor-assistente-android-alpha
          path: android-delivery/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports/
